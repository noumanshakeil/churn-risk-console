<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Score account health and generate save playbooks.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/accounts"><label>Account</label><input name="name" required/>
<label>MRR</label><input name="mrr" type="number" value="500"/>
<label>Days since login</label><input name="days_since_login" type="number" value="21"/>
<label>Open tickets</label><input name="tickets_open" type="number" value="2"/>
<label>NPS</label><input name="nps" type="number" step="0.1" value="5"/>
<button type="submit">Score</button></form></section>
<section class="card">{% for a in accounts %}<article class="card" style="margin:.5rem 0">
<span class="pill">{{ a.band }}</span> <span class="pill">{{ a.risk }}</span> <strong>{{ a.name }}</strong>
<pre>{{ a.playbook }}</pre></article>{% endfor %}</section></div></main></body></html>
